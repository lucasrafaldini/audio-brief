[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-brief"
version = "0.3.0"
description = "Record or transcribe audio with Whisper and get summaries, mindmaps, keywords and transcripts."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lucas Rafaldini" }]
keywords = ["whisper", "transcription", "audio", "summary", "cli"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
# The text analysis needs nothing; pick a speech-recognition engine as an extra:
#   pip install 'audio-brief[whisper]'        accurate, many languages (PyTorch, 1-3 GB)
#   pip install 'audio-brief[pocketsphinx]'   small, offline, English only (~40 MB)
dependencies = []

[project.optional-dependencies]
whisper = ["openai-whisper>=20231117"]
pocketsphinx = ["pocketsphinx>=5.0"]
macos-app = ["py2app"]
dev = ["pytest>=7"]
# `make bench`: reference metric implementations + baseline systems. Baselines
# are pinned exactly because their output is part of the published numbers.
bench = ["rouge-score==0.1.2", "segeval==2.0.11", "yake==0.7.3", "summa==1.2.0", "sumy==0.13.0", "scikit-learn>=1.3", "nltk>=3.8", "pocketsphinx==5.1.1", "jiwer==4.0.0"]

[project.scripts]
audio-brief = "audio_brief.cli:main"

[tool.setuptools]
packages = ["audio_brief"]

# pytest is configured in pytest.ini (the only config file it reads).
